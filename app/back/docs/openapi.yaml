openapi: 3.1.0
info:
  title: Benigno Solucoes - API M3 (integracao em validacao)
  version: 2.1.0
  description: Inventario das rotas solicitadas pelo front. As operacoes marcadas como parciais nao foram homologadas
    contra PostgreSQL real; schemas de varias operacoes ainda estao pendentes.
servers:
- url: /
  description: Mesma origem do front (Nginx)
paths:
  /api/auth/login:
    post:
      summary: Autenticar com email e senha
      x-integracao-m3: parcial - validação de JSON, regras e testes reais pendente
      responses:
        '200':
          description: Resposta do recurso (estrutura a homologar contra front/js/api.js e front/dev/servidor.mjs)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Identidade'
        '400': &id001
          description: Erro no processamento
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
          headers:
            Retry-After:
              description: Segundos ate nova tentativa
              schema:
                type: integer
                minimum: 1
        '401': *id001
        '403': *id001
        '404': *id001
        '409': *id001
        '413': *id001
        '422': *id001
        '429': *id001
        '500': *id001
        '503': *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - senha
              properties:
                email:
                  type: string
                  format: email
                senha:
                  type: string
                  format: password
              additionalProperties: false
      security: []
  /api/auth/sessao:
