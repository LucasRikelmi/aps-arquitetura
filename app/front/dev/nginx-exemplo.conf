# Exemplo de servidor Nginx para o front (M2). NÃO é a configuração oficial: o item 3.12 (M3) define
# porta, certificado e diretório K8. Testado com nginx 1.24 servindo o build de build.mjs e com
# dev/servidor.mjs no lugar do back-end. Ajustar: root (K8), ssl_certificate*, upstream da API.
server {
    listen 8443 ssl;
    server_name _;
    ssl_protocols TLSv1.3;
    ssl_certificate     /caminho/cert.pem;
    ssl_certificate_key /caminho/key.pem;

    root /var/www/rh-front;          # K8: diretório gerado por FRONT_DIST=... node build.mjs
    index index.html;
    charset utf-8;

    # O front não usa script nem estilo inline (README, "Decisões e limites").
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Rotas por hash: só index.html e os arquivos estáticos existem; não precisa de try_files para rotas.
    location / {
        try_files $uri $uri/ =404;
        # add_header num location substitui os do server: repetir aqui todos os cabeçalhos.
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location = /build-info.json { return 404; }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;   # back-end (aqui: dev/servidor.mjs)
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_intercept_errors on;
        error_page 502 503 504 = @api_indisponivel;
    }
    location @api_indisponivel {
        default_type application/json;
        return 503 '{"mensagem":"Serviço indisponível."}';
    }
}
