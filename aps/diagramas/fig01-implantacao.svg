<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650" font-family="Arial, Helvetica, sans-serif"><rect width="1400" height="650" fill="#fff"/><rect x="20" y="50" width="260" height="270" rx="4" fill="#FFFDE7" stroke="#C9A800" stroke-width="1.5"/><text x="34" y="72" font-size="12" font-weight="bold" fill="#5c4b00">Máquina do usuário</text><rect x="45" y="100" width="210" height="195" rx="4" fill="#fff" stroke="#8a8a8a" stroke-width="1.3"/><text x="150" y="122" font-size="12.5" font-weight="bold" text-anchor="middle">Browser</text><rect x="62" y="136" width="176" height="142" rx="3" fill="#EDEDFB" stroke="#6B6BBF" stroke-width="1.3"/><text x="150" y="159" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#2d2d6b">Documento HTML</text><text x="150" y="175" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#2d2d6b">e script de login</text><line x1="78" y1="188" x2="222" y2="188" stroke="#aaaacc"/><text x="150" y="206" font-size="9.5" text-anchor="middle">constrói o DOM, intercepta</text><text x="150" y="221" font-size="9.5" text-anchor="middle">a submissão do formulário</text><text x="150" y="236" font-size="9.5" text-anchor="middle">e emite fetch()</text><text x="150" y="257" font-size="9.5" text-anchor="middle">POST /api/auth/login</text><text x="150" y="272" font-size="9.5" text-anchor="middle">corpo em JSON</text><ellipse cx="150" cy="492" rx="65" ry="14" fill="#EDEDFB" stroke="#6B6BBF" stroke-width="1.3"/><rect x="85" y="422" width="130" height="70" fill="#EDEDFB"/><line x1="85" y1="422" x2="85" y2="492" stroke="#6B6BBF" stroke-width="1.3"/><line x1="215" y1="422" x2="215" y2="492" stroke="#6B6BBF" stroke-width="1.3"/><ellipse cx="150" cy="422" rx="65" ry="14" fill="#EDEDFB" stroke="#6B6BBF" stroke-width="1.3"/><text x="150" y="455" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#2d2d6b">Servidor DNS</text><text x="150" y="471" font-size="9" text-anchor="middle">(infraestrutura externa)</text><line x1="150" y1="295" x2="150" y2="396" stroke="#333" stroke-width="1.4"/><path d="M144 396 L156 396 L150 406 z" fill="#333"/><text x="163" y="330" font-size="10">1. resolução do nome</text><text x="163" y="345" font-size="10">DNS — UDP/53</text><rect x="470" y="50" width="900" height="455" rx="4" fill="#FFFDE7" stroke="#C9A800" stroke-width="1.5"/><text x="484" y="72" font-size="12" font-weight="bold" fill="#5c4b00">Servidor (host Linux)</text><rect x="500" y="120" width="210" height="170" rx="4" fill="#EDEDFB" stroke="#6B6BBF" stroke-width="1.4"/><text x="605" y="146" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#2d2d6b">Nginx</text><text x="605" y="166" font-size="10" text-anchor="middle">Servidor web + proxy reverso</text><line x1="518" y1="178" x2="692" y2="178" stroke="#aaaacc"/><text x="605" y="196" font-size="9.5" text-anchor="middle">porta 443 — terminação TLS</text><text x="605" y="212" font-size="9.5" text-anchor="middle">limite de corpo e de taxa por IP</text><text x="605" y="234" font-size="9.5" font-weight="bold" text-anchor="middle" fill="#2d2d6b">roteamento por caminho:</text><text x="605" y="250" font-size="9.5" text-anchor="middle">/ → arquivos estáticos</text><text x="605" y="266" font-size="9.5" text-anchor="middle">/api/* → proxy_pass</text><rect x="500" y="355" width="210" height="110" rx="4" fill="#F4F4F4" stroke="#8a8a8a" stroke-width="1.3" stroke-dasharray="5 3"/><text x="605" y="381" font-size="11.5" font-weight="bold" text-anchor="middle">Arquivos estáticos</text><text x="605" y="401" font-size="9.5" text-anchor="middle">no sistema de arquivos</text><text x="605" y="416" font-size="9.5" text-anchor="middle">do servidor</text><text x="605" y="435" font-size="9.5" text-anchor="middle" fill="#555">index.html, .js, .css</text><text x="605" y="453" font-size="9" font-style="italic" text-anchor="middle" fill="#666">servidos pelo Nginx, sem passar pelo Node</text><rect x="830" y="120" width="210" height="170" rx="4" fill="#EDEDFB" stroke="#6B6BBF" stroke-width="1.4"/><text x="935" y="146" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#2d2d6b">Node.js + Express</text><text x="935" y="166" font-size="10" text-anchor="middle">Servidor de aplicação</text><line x1="848" y1="178" x2="1022" y2="178" stroke="#aaaacc"/><text x="935" y="196" font-size="9.5" text-anchor="middle">escuta 127.0.0.1:3000</text><text x="935" y="214" font-size="9.5" text-anchor="middle">middlewares: JSON e validação</text><text x="935" y="232" font-size="9.5" text-anchor="middle">verificação Argon2id fora</text><text x="935" y="247" font-size="9.5" text-anchor="middle">da thread principal</text><text x="935" y="268" font-size="9" text-anchor="middle">pool de conexões e consultas parametrizadas</text><ellipse cx="1255" cy="272" rx="75" ry="18" fill="#EDEDFB" stroke="#6B6BBF" stroke-width="1.4"/><rect x="1180" y="158" width="150" height="114" fill="#EDEDFB"/><line x1="1180" y1="158" x2="1180" y2="272" stroke="#6B6BBF" stroke-width="1.4"/><line x1="1330" y1="158" x2="1330" y2="272" stroke="#6B6BBF" stroke-width="1.4"/><ellipse cx="1255" cy="158" rx="75" ry="18" fill="#EDEDFB" stroke="#6B6BBF" stroke-width="1.4"/><text x="1255" y="196" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#2d2d6b">PostgreSQL</text><text x="1255" y="216" font-size="10" text-anchor="middle">SGBD relacional</text><text x="1255" y="234" font-size="9.5" text-anchor="middle">porta 5432</text><line x1="255" y1="200" x2="488" y2="200" stroke="#333" stroke-width="1.4"/><path d="M488 194 L498 200 L488 206 z" fill="#333"/><text x="375" y="178" font-size="10" text-anchor="middle">2. HTTPS — HTTP/1.1 sobre TLS 1.3</text><text x="375" y="192" font-size="10" text-anchor="middle">TCP/443</text><line x1="605" y1="290" x2="605" y2="343" stroke="#333" stroke-width="1.4"/><path d="M599 343 L611 343 L605 353 z" fill="#333"/><text x="618" y="312" font-size="10">3a. GET / → leitura em disco</text><text x="618" y="327" font-size="10">(sem proxy para a aplicação)</text><line x1="710" y1="200" x2="818" y2="200" stroke="#333" stroke-width="1.4"/><path d="M818 194 L828 200 L818 206 z" fill="#333"/><text x="767" y="171" font-size="9" text-anchor="middle">3b. /api/* → proxy_pass</text><text x="767" y="184" font-size="9" text-anchor="middle">HTTP/1.1 em loopback</text><text x="767" y="197" font-size="9" text-anchor="middle">+ X-Forwarded-For</text><line x1="1040" y1="200" x2="1168" y2="200" stroke="#333" stroke-width="1.4"/><path d="M1168 194 L1178 200 L1168 206 z" fill="#333"/><text x="1105" y="178" font-size="9.5" text-anchor="middle">4. protocolo do PostgreSQL</text><text x="1105" y="192" font-size="9.5" text-anchor="middle">TCP/5432</text><path d="M500 410 L310 410 L310 258 L267 258" fill="none" stroke="#8a6d1f" stroke-width="1.3" stroke-dasharray="6 4"/><path d="M267 252 L257 258 L267 264 z" fill="#8a6d1f"/><text x="418" y="375" font-size="9.5" text-anchor="middle" fill="#8a6d1f">entrega do HTML e dos scripts</text><text x="418" y="390" font-size="9.5" text-anchor="middle" fill="#8a6d1f">(resposta da etapa 2)</text><line x1="20" y1="568" x2="1370" y2="568" stroke="#ccc"/><text x="20" y="590" font-size="9.5" fill="#555">Pilha: Nginx (servidor web e proxy reverso), Node.js com Express (servidor de aplicação) e PostgreSQL (SGBD). O browser e o servidor DNS são componentes de apoio e não integram a pilha.</text><text x="20" y="607" font-size="9.5" fill="#555">Protocolos conforme RFC 1034/1035 (DNS), RFC 9293 (TCP), RFC 8446 (TLS 1.3), RFC 9110 (semântica HTTP) e RFC 9112 (HTTP/1.1). A etapa 3b exige proxy_http_version 1.1 no Nginx.</text></svg>
