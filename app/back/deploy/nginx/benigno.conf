# Copie este arquivo para /etc/nginx/conf.d/benigno.conf.
# Diretivas limit_req_zone ficam em http {}, no contexto de conf.d.
# Substitua EXEMPLO.DOMINIO.BR pelo domínio real antes de ativar.
limit_req_zone $binary_remote_addr zone=benigno_login_ip:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name EXEMPLO.DOMINIO.BR;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;  # Nginx >= 1.25.1; não habilitado no projeto APS original
    server_name EXEMPLO.DOMINIO.BR;

    ssl_protocols TLSv1.3;
    ssl_certificate /etc/letsencrypt/live/EXEMPLO.DOMINIO.BR/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/EXEMPLO.DOMINIO.BR/privkey.pem;
    ssl_session_cache shared:benigno_tls:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;
    add_header Strict-Transport-Security "max-age=31536000" always; # ativar apenas após validar HTTPS
    add_header X-Content-Type-Options nosniff always;
    server_tokens off;

    root /var/www/benigno/public;
    index index.html;
    client_max_body_size 100k;
    limit_req_status 429;

    # Não interceptar erros da API: o back-end preserva 400/401/500/503 com JSON.
    proxy_intercept_errors off;

    location = /api/auth/login {
        client_max_body_size 1k;
        limit_req zone=benigno_login_ip burst=10 nodelay;
        error_page 413 = @erro_413;
        error_page 429 = @erro_429;
        include /etc/nginx/snippets/benigno-proxy.conf;
        proxy_pass http://127.0.0.1:3000;
    }

    location /api/ {
        error_page 413 = @erro_413;
        include /etc/nginx/snippets/benigno-proxy.conf;
        proxy_pass http://127.0.0.1:3000;
    }

    # Arquivos com nome versionado por hash: cache longo.
    location ~* "^/assets/.+\.[a-f0-9]{8,}\.(?:js|css|png|jpg|jpeg|svg|webp|woff2)$" {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Arquivos estáticos normais, com renovação curta.
    location /assets/ {
        try_files $uri =404;
        expires 1h;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # HTML deve ser revalidado; rotas front-end são atendidas pelo index.html.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location @erro_413 {
        internal;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 413 '{"mensagem":"Requisicao muito grande."}';
    }
    location @erro_429 {
        internal;
        add_header Retry-After 60 always;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 429 '{"mensagem":"Muitas requisicoes. Tente novamente mais tarde."}';
    }
    # Falhas geradas pelo próprio proxy, não pelo PostgreSQL ou pelo Express.
    error_page 502 = @erro_502;
    error_page 504 = @erro_504;
    location @erro_502 {
        internal;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 502 '{"mensagem":"Servico temporariamente indisponivel."}';
    }
    location @erro_504 {
        internal;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 504 '{"mensagem":"Tempo limite do servico excedido."}';
    }
}
