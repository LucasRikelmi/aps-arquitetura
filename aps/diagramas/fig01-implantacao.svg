<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-describedby="desc">
  <desc id="desc">Navegador e serviço DNS externos ao servidor Linux. No host Linux, Nginx entrega arquivos estáticos e encaminha a API ao Node.js com Express pela interface de loopback. Node.js consulta PostgreSQL. Todos os fluxos de requisição e resposta são explicitados na legenda.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L10 5 L0 10 Z" fill="#27536a"/></marker>
</defs>
  <rect x="1" y="1" width="1278" height="798" fill="#fff" stroke="#e0e6e9" stroke-width="2"/>
  <g transform="translate(0,-60)">

  <rect x="44" y="119" width="267" height="388" rx="17" fill="#f1f7fb" stroke="#9eb5c2" stroke-width="2"/>
  <text x="65" y="148" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#163042">Componentes externos</text>
  <rect fill="#ffffff" stroke="#7b9aab" stroke-width="2" rx="12" x="64" y="171" width="227" height="148"/>
  <text x="177" y="201" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#163042">Navegador</text>
  <text x="177" y="231" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#163042">HTML e JavaScript</text>
  <text x="177" y="256" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#163042">GET / e POST /api/auth/login</text>
  <text x="177" y="278" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#163042">executados no cliente</text>
  <rect fill="#ffffff" stroke="#7b9aab" stroke-width="2" rx="12" x="64" y="385" width="227" height="94"/>
  <text x="177" y="417" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#163042">Serviço DNS</text>
  <text x="177" y="446" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#163042">Resolução do nome</text>

  <rect x="359" y="119" width="875" height="388" rx="17" fill="#f7f8ea" stroke="#c0c88e" stroke-width="2"/>
  <text x="381" y="148" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#163042">Servidor Linux — mesma máquina física ou virtual</text>
  <rect fill="#ffffff" stroke="#7b9aab" stroke-width="2" rx="12" x="405" y="174" width="209" height="162"/>
  <text x="509" y="202" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#163042">Nginx</text>
  <text x="509" y="230" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#163042">Servidor web</text>
  <text x="509" y="255" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#163042">Terminação TLS</text>
  <text x="509" y="277" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#163042">/ → arquivos estáticos</text>
  <text x="509" y="299" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#163042">/api/* → proxy reverso</text>

  <rect fill="#ffffff" stroke="#7b9aab" stroke-width="2" rx="12" x="697" y="174" width="222" height="162"/>
  <text x="808" y="202" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#163042">Node.js + Express</text>
  <text x="808" y="230" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#163042">Servidor de aplicação</text>
  <text x="808" y="255" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#163042">Validação e rota de login</text>
  <text x="808" y="277" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#163042">Argon2id fora da</text>
  <text x="808" y="296" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#163042">thread principal</text>
  <text x="808" y="320" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#163042">escuta em 127.0.0.1:3000</text>

  <rect fill="#ffffff" stroke="#7b9aab" stroke-width="2" rx="12" x="1005" y="174" width="190" height="162"/>
  <text x="1100" y="204" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#163042">PostgreSQL</text>
  <text x="1100" y="236" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#163042">Banco relacional</text>
  <text x="1100" y="264" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#163042">Consultas</text>
  <text x="1100" y="286" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#163042">parametrizadas</text>

  <rect fill="#ffffff" stroke="#7b9aab" stroke-width="2" rx="12" x="405" y="391" width="209" height="87"/>
  <text x="509" y="421" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#163042">Arquivos estáticos</text>
  <text x="509" y="450" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#163042">HTML, JS, CSS em disco</text>

  <path fill="none" stroke="#27536a" stroke-width="2.4" marker-end="url(#arrow)" d="M160 319 V382"/>
  <path fill="none" stroke="#27536a" stroke-width="2.4" marker-end="url(#arrow)" d="M194 385 V323"/>
  <text x="101" y="349" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#27536a">1a</text>
  <text x="206" y="354" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#27536a">1b</text>
  <path fill="none" stroke="#27536a" stroke-width="2.4" marker-end="url(#arrow)" d="M291 218 H401"/>
  <path fill="none" stroke="#27536a" stroke-width="2.4" marker-end="url(#arrow)" d="M405 314 H294"/>
  <text x="320" y="205" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#27536a">2 e 5</text>
  <text x="320" y="336" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#27536a">4 e 10</text>
  <text x="317" y="248" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#163042">HTTPS</text>
  <text x="317" y="267" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#163042">TLS 1.3</text>
  <text x="317" y="286" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#163042">TCP 443</text>

  <path fill="none" stroke="#27536a" stroke-width="2.4" marker-end="url(#arrow)" d="M614 215 H693"/>
  <path fill="none" stroke="#27536a" stroke-width="2.4" marker-end="url(#arrow)" d="M697 314 H618"/>
  <text x="645" y="201" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#27536a">6</text>
  <text x="645" y="336" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#27536a">9</text>
  <text x="630" y="244" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#163042">HTTP</text>
  <text x="625" y="263" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#163042">loopback</text>
  <text x="625" y="283" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#163042">TCP 3000</text>

  <path fill="none" stroke="#27536a" stroke-width="2.4" marker-end="url(#arrow)" d="M919 215 H1001"/>
  <path fill="none" stroke="#27536a" stroke-width="2.4" marker-end="url(#arrow)" d="M1005 290 H923"/>
  <text x="953" y="201" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#27536a">7</text>
  <text x="953" y="307" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#27536a">8</text>
  <text x="937" y="254" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#163042">TCP 5432</text>

  <path fill="none" stroke="#27536a" stroke-width="2.4" marker-end="url(#arrow)" d="M489 336 V388"/>
  <path fill="none" stroke="#27536a" stroke-width="2.4" marker-end="url(#arrow)" d="M530 391 V340"/>
  <text x="453" y="365" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#27536a">3a</text>
  <text x="541" y="368" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#27536a">3b</text>

  <rect x="44" y="537" width="1190" height="268" rx="13" fill="#f8fafb" stroke="#d1dde3"/>
  <text x="66" y="568" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#163042">Sequência dos fluxos</text>
  <line x1="635" y1="584" x2="635" y2="779" stroke="#c9d5db" stroke-width="2"/>
  <text x="68" y="602" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#163042">Carregamento da interface</text>
  <text x="68" y="635" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#163042">1a–1b  Consulta DNS e retorno do endereço IP.</text>
  <text x="68" y="666" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#163042">2          GET / do navegador para o Nginx, via HTTPS.</text>
  <text x="68" y="697" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#163042">3a–3b  Leitura do arquivo no disco e retorno ao Nginx.</text>
  <text x="68" y="728" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#163042">4          Resposta HTTPS com HTML, JavaScript e CSS.</text>
  <text x="68" y="765" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#163042">A versão externa de HTTP depende da negociação/configuração.</text>

  <text x="660" y="602" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#163042">Verificação de credenciais</text>
  <text x="660" y="635" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#163042">5       POST /api/auth/login do navegador por HTTPS.</text>
  <text x="660" y="666" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#163042">6       Nginx → Express por HTTP na interface de loopback.</text>
  <text x="660" y="697" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#163042">7–8    Consulta parametrizada ao PostgreSQL e resultado.</text>
  <text x="660" y="728" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#163042">9–10  Resposta JSON do Express via Nginx ao navegador.</text>
  <text x="660" y="765" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#163042">O salto interno não sai do host; não usa TLS nesta proposta.</text>

  <text x="50" y="830" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#163042">Nota: as etapas representam fluxos lógicos da implantação proposta, sem presumir uma configuração executada.</text>
  </g>
</svg>
