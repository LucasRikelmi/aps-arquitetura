<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="860" viewBox="0 0 1280 860" role="img" aria-labelledby="title desc">
  <title id="title">Figura 1 — Implantação proposta do ambiente operacional</title>
  <desc id="desc">Navegador e serviço DNS externos ao servidor Linux. No host Linux, Nginx entrega arquivos estáticos e encaminha a API ao Node.js com Express pela interface de loopback. Node.js consulta PostgreSQL. Todos os fluxos de requisição e resposta são explicitados na legenda.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L10 5 L0 10 Z" fill="#27536a"/></marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #163042; }
      .h1 { font-size: 27px; font-weight: 700; }
      .h2 { font-size: 19px; font-weight: 700; }
      .body { font-size: 16px; }
      .small { font-size: 14px; }
      .tag { font-size: 13px; font-weight: 700; fill: #27536a; }
      .sub { font-size: 16px; font-weight: 700; }
      .arrow { fill: none; stroke: #27536a; stroke-width: 2.4; marker-end: url(#arrow); }
      .box { fill: #fff; stroke: #7b9aab; stroke-width: 2; rx: 12; }
    </style>
  </defs>
  <rect x="1" y="1" width="1278" height="858" fill="#fff" stroke="#e0e6e9" stroke-width="2"/>
  <text x="50" y="54" class="h1">Figura 1 — Implantação proposta do ambiente operacional</text>
  <text x="50" y="82" class="body">Pilha sob responsabilidade da equipe: Nginx + Node.js/Express + PostgreSQL</text>

  <rect x="44" y="119" width="267" height="388" rx="17" fill="#f1f7fb" stroke="#9eb5c2" stroke-width="2"/>
  <text x="65" y="148" class="h2">Componentes externos</text>
  <rect class="box" x="64" y="171" width="227" height="148"/>
  <text x="177" y="201" text-anchor="middle" class="h2">Navegador</text>
  <text x="177" y="231" text-anchor="middle" class="body">HTML e JavaScript</text>
  <text x="177" y="256" text-anchor="middle" class="small">GET / e POST /api/auth/login</text>
  <text x="177" y="278" text-anchor="middle" class="small">executados no cliente</text>
  <rect class="box" x="64" y="385" width="227" height="94"/>
  <text x="177" y="417" text-anchor="middle" class="h2">Serviço DNS</text>
  <text x="177" y="446" text-anchor="middle" class="small">Resolução do nome</text>

  <rect x="359" y="119" width="875" height="388" rx="17" fill="#f7f8ea" stroke="#c0c88e" stroke-width="2"/>
  <text x="381" y="148" class="h2">Servidor Linux — mesma máquina física ou virtual</text>
  <rect class="box" x="405" y="174" width="209" height="162"/>
  <text x="509" y="202" text-anchor="middle" class="h2">Nginx</text>
  <text x="509" y="230" text-anchor="middle" class="body">Servidor web</text>
  <text x="509" y="255" text-anchor="middle" class="small">Terminação TLS</text>
  <text x="509" y="277" text-anchor="middle" class="small">/ → arquivos estáticos</text>
  <text x="509" y="299" text-anchor="middle" class="small">/api/* → proxy reverso</text>

  <rect class="box" x="697" y="174" width="222" height="162"/>
  <text x="808" y="202" text-anchor="middle" class="h2">Node.js + Express</text>
  <text x="808" y="230" text-anchor="middle" class="body">Servidor de aplicação</text>
  <text x="808" y="255" text-anchor="middle" class="small">Validação e rota de login</text>
  <text x="808" y="277" text-anchor="middle" class="small">Argon2id assíncrono</text>
  <text x="808" y="299" text-anchor="middle" class="small">escuta em 127.0.0.1:3000</text>

  <rect class="box" x="1005" y="174" width="190" height="162"/>
  <text x="1100" y="204" text-anchor="middle" class="h2">PostgreSQL</text>
  <text x="1100" y="236" text-anchor="middle" class="body">Banco relacional</text>
  <text x="1100" y="264" text-anchor="middle" class="small">Consultas</text>
  <text x="1100" y="286" text-anchor="middle" class="small">parametrizadas</text>

  <rect class="box" x="405" y="391" width="209" height="87"/>
  <text x="509" y="421" text-anchor="middle" class="h2">Arquivos estáticos</text>
  <text x="509" y="450" text-anchor="middle" class="small">HTML, JS, CSS em disco</text>

  <path class="arrow" d="M160 319 V382"/>
  <path class="arrow" d="M194 385 V323"/>
  <text x="101" y="349" class="tag">1a</text>
  <text x="206" y="354" class="tag">1b</text>
  <path class="arrow" d="M291 218 H401"/>
  <path class="arrow" d="M405 291 H294"/>
  <text x="320" y="205" class="tag">2 e 5</text>
  <text x="320" y="310" class="tag">4 e 10</text>
  <text x="317" y="248" class="small">HTTPS</text>
  <text x="317" y="267" class="small">TLS 1.3</text>

  <path class="arrow" d="M614 215 H693"/>
  <path class="arrow" d="M697 290 H618"/>
  <text x="645" y="201" class="tag">6</text>
  <text x="645" y="307" class="tag">9</text>
  <text x="630" y="244" class="small">HTTP</text>
  <text x="625" y="263" class="small">loopback</text>

  <path class="arrow" d="M919 215 H1001"/>
  <path class="arrow" d="M1005 290 H923"/>
  <text x="953" y="201" class="tag">7</text>
  <text x="953" y="307" class="tag">8</text>
  <text x="937" y="244" class="small">TCP</text>
  <text x="935" y="263" class="small">5432</text>

  <path class="arrow" d="M489 336 V388"/>
  <path class="arrow" d="M530 391 V340"/>
  <text x="453" y="365" class="tag">3a</text>
  <text x="541" y="368" class="tag">3b</text>

  <rect x="44" y="537" width="1190" height="268" rx="13" fill="#f8fafb" stroke="#d1dde3"/>
  <text x="66" y="568" class="h2">Sequência dos fluxos</text>
  <line x1="635" y1="584" x2="635" y2="779" stroke="#c9d5db" stroke-width="2"/>
  <text x="68" y="602" class="sub">Carregamento da interface</text>
  <text x="68" y="635" class="body">1a–1b  Consulta DNS e retorno do endereço IP.</text>
  <text x="68" y="666" class="body">2          GET / do navegador para o Nginx, via HTTPS.</text>
  <text x="68" y="697" class="body">3a–3b  Leitura do arquivo no disco e retorno ao Nginx.</text>
  <text x="68" y="728" class="body">4          Resposta HTTPS com HTML, JavaScript e CSS.</text>
  <text x="68" y="765" class="small">A versão externa de HTTP depende da negociação/configuração.</text>

  <text x="660" y="602" class="sub">Verificação de credenciais</text>
  <text x="660" y="635" class="body">5       POST /api/auth/login do navegador por HTTPS.</text>
  <text x="660" y="666" class="body">6       Nginx → Express por HTTP na interface de loopback.</text>
  <text x="660" y="697" class="body">7–8    Consulta parametrizada ao PostgreSQL e resultado.</text>
  <text x="660" y="728" class="body">9–10  Resposta JSON do Express via Nginx ao navegador.</text>
  <text x="660" y="765" class="small">O salto interno não sai do host; não usa TLS nesta proposta.</text>

  <text x="50" y="830" class="small">Nota: as etapas descrevem fluxos lógicos da arquitetura proposta. Implementação e parâmetros devem ser documentados nos itens 1.4 a 1.6.</text>
</svg>
