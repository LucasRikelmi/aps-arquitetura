components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-benigno_session
  schemas:
    Identidade:
      type: object
      required:
      - nome
      - perfil
      properties:
        nome:
          type: string
        perfil:
          type: string
          enum:
          - colaborador
          - gestor
          - rh
          - diretoria
          - administracao
    Erro:
      type: object
      required:
      - mensagem
      properties:
        mensagem:
          type: string
